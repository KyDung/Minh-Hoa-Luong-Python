<!doctype html>
<html lang="vi">
  <head>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sơ Đồ Đệ Quy & Luồng Chạy Python - Debug Từng Bước</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- PrismJS CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css"
      rel="stylesheet"
    />

    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>

      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PrismJS Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>

    <style>
      code[class*="language-"],
      pre[class*="language-"] {
        text-shadow: none !important;
      }
      .code-editor-textarea {
        color: transparent !important;
        caret-color: #333;
        background: transparent !important;
      }
      .code-editor-textarea::selection {
        background: rgba(59, 130, 246, 0.4) !important;
        color: transparent !important;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #3b82f6;

        margin-top: -6px;
      }
      input[type="range"]::-webkit-slider-runnable-track {
        width: 100%;

      .node-container {
        transition:
          height 0.3s cubic-bezier(0.4, 0, 0.2, 1),

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      function replaceVariablesInCode(originalCode, callArgs) {
        let replaced = originalCode;
        if (!callArgs) return replaced;
        for (const [key, val] of Object.entries(callArgs)) {
          const regex = new RegExp(`\\b${key}\\b`, "g");
          replaced = replaced.replace(regex, val);
        }
        return replaced;
      }

      function getFunctionBlock(code, funcName) {
        const lines = code.split("\n");
        let startIdx = -1;
        let indentLevel = 0;

        for (let i = 0; i < lines.length; i++) {
          const match = lines[i].match(/^(\s*)def\s+([a-zA-Z_]\w*)\s*\(/);
          if (match && match[2] === funcName) {
            startIdx = i;
            indentLevel = match[1].length;
            break;
          }
        }

        if (startIdx === -1) return { code: code, startLine: 1 };

        let endIdx = startIdx;
        for (let i = startIdx + 1; i < lines.length; i++) {
          const line = lines[i];
          if (line.trim() === "") {
            endIdx = i;
            continue;
          }
          const currentIndent = line.match(/^\s*/)[0].length;
          if (currentIndent <= indentLevel) {
            break;
          }
          endIdx = i;
        }

        const funcLines = lines.slice(startIdx, endIdx + 1);
        return {
          code: funcLines.join("\n"),
          startLine: startIdx + 1,
        };
      }

      function layoutTree(
        callEvents,
        userCode,
        collapsedNodes,
        maxVarsPerNode = {},
      ) {
        if (!callEvents || callEvents.length === 0)
          return { nodes: [], edges: [] };

        const nodesMap = {};
        let root = null;

        const nodeW = 560;
        const gapX = 70;
        const gapY = 80;
        const headerH = 44;
        const footerH = 40;

        callEvents.forEach((d) => {
          const isCollapsed = collapsedNodes[d.id];
          const isMain = d.name === "<module>";

          const blockInfo = isMain
            ? { code: userCode }
            : getFunctionBlock(userCode, d.name);
          const codeLinesCount = blockInfo.code.split("\n").length;

          const codeH = codeLinesCount * 20 + 32;
          const varCount = maxVarsPerNode[d.id] || 0;
          const varsH = 60 + varCount * 54;

          const bodyH = Math.min(Math.max(codeH, varsH), 420);
          const expandedH = headerH + footerH + bodyH;

          nodesMap[d.id] = {
            ...d,
            children: [],
            x: 0,
            y: 0,
            w: nodeW,
            h: isCollapsed ? headerH : expandedH,
          };
        });

        callEvents.forEach((d) => {
          if (d.parent === null) {
            if (!root) root = nodesMap[d.id];
          } else {
            if (nodesMap[d.parent]) {
              nodesMap[d.parent].children.push(nodesMap[d.id]);
            }
          }
        });

        function computeY(node) {
          if (node.parent === null) {
            node.y = 0;
          } else {
            const parentNode = nodesMap[node.parent];
            node.y = parentNode.y + parentNode.h + gapY;
          }
          node.children.forEach(computeY);
        }
        if (root) computeY(root);

        let currentX = 0;
        function computeX(node) {
          if (!node.children || node.children.length === 0) {
            node.x = currentX;
            currentX += node.w + gapX;
          } else {
            node.children.forEach(computeX);
            const firstChild = node.children[0];
            const lastChild = node.children[node.children.length - 1];
            node.x = (firstChild.x + lastChild.x) / 2;
            currentX = Math.max(currentX, node.x + node.w + gapX);
          }
        }
        if (root) computeX(root);

        const nodes = Object.values(nodesMap);
        const edges = [];
        nodes.forEach((n) => {
          n.children.forEach((c) => {
            edges.push({ source: n, target: c });
          });
        });

        const minX = Math.min(...nodes.map((n) => n.x)) || 0;
        nodes.forEach((n) => {
          n.x = n.x - minX + 50;
          n.y = n.y + 100;
        });

        return { nodes, edges };
      }

      function App() {
        const DEFAULT_CODE = `n = int(input("Nhập số nguyên n: "))

if n < 2:
    print(n, "không phải số nguyên tố")
else:
    la_so_nguyen_to = True
    for i in range(2, n):
        if n % i == 0:
            la_so_nguyen_to = False
            break

    if la_so_nguyen_to:
        print(n, "là số nguyên tố")
    else:
        print(n, "không phải số nguyên tố")`;

        const [code, setCode] = useState(DEFAULT_CODE);
        const [runningCode, setRunningCode] = useState(DEFAULT_CODE);
        const [isPyodideReady, setIsPyodideReady] = useState(false);
        const [isRunning, setIsRunning] = useState(false);
        const [error, setError] = useState(null);

        const [traceEvents, setTraceEvents] = useState([]);
        const [rawCallEvents, setRawCallEvents] = useState([]);
        const [collapsedNodes, setCollapsedNodes] = useState({});

        const [step, setStep] = useState(0);
        const [isPlaying, setIsPlaying] = useState(false);
        const [isSidebarOpen, setIsSidebarOpen] = useState(true);

        const [pan, setPan] = useState({ x: 0, y: 0 });
        const [scale, setScale] = useState(1);
        const [isDragging, setIsDragging] = useState(false);
        const dragStart = useRef({ x: 0, y: 0 });

        const preRef = useRef(null);
        const canvasRef = useRef(null);

        const handleEditorScroll = (e) => {
          if (preRef.current) {
            preRef.current.scrollTop = e.target.scrollTop;
            preRef.current.scrollLeft = e.target.scrollLeft;
          }
        };

        const layout = useMemo(() => {
          const maxVarsCounts = {};
          traceEvents.forEach((ev) => {
            if (ev.locals) {
              const c = Object.keys(ev.locals).length;
              maxVarsCounts[ev.node_id] = Math.max(
                maxVarsCounts[ev.node_id] || 0,
                c,
              );
            }
          });
          return layoutTree(
            rawCallEvents,
            runningCode,
            collapsedNodes,
            maxVarsCounts,
          );
        }, [rawCallEvents, runningCode, collapsedNodes, traceEvents]);

        useEffect(() => {
          const loadPyodideScript = async () => {
            try {
              const script = document.createElement("script");
              script.src =
                "https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js";
              script.onload = async () => {
                window.pyodide = await window.loadPyodide();
                setIsPyodideReady(true);
              };
              document.body.appendChild(script);
            } catch (err) {
              setError(
                "Không thể tải Pyodide. Vui lòng kiểm tra kết nối mạng.",
              );
            }
          };
          loadPyodideScript();
        }, []);

        useEffect(() => {
          let timer;
          if (isPlaying && step < traceEvents.length - 1) {
            timer = setTimeout(() => {
              setStep((s) => s + 1);
            }, 800);
          } else if (step >= traceEvents.length - 1) {
            setIsPlaying(false);
          }
          return () => clearTimeout(timer);
        }, [isPlaying, step, traceEvents.length]);

        const toggleCollapseNode = (nodeId, e) => {
          e.stopPropagation();
          setCollapsedNodes((prev) => ({
            ...prev,
            [nodeId]: !prev[nodeId],
          }));
        };

        const runCode = async (showAll = false) => {
          if (!isPyodideReady || !window.pyodide) return;
          setIsRunning(true);
          setError(null);
          setIsPlaying(false);
          setTraceEvents([]);
          setRawCallEvents([]);
          setCollapsedNodes({});
          setStep(0);
          setRunningCode(code);

          try {
            window.pyodide.globals.set("user_code_string", code);

            const pyCode = `
import sys
import json
import traceback
import builtins
import js

def mock_input(prompt_text=""):
    res = js.prompt(prompt_text)
    return res if res is not None else ""

builtins.input = mock_input

_events = []
_call_stack = []
_node_counter = 0
_nodes_map = {}

def _trace_calls(frame, event, arg):
    global _node_counter
    if frame.f_code.co_filename != "<string>": return None

    if event == "call":
        node_id = _node_counter
        _node_counter += 1
        func_name = frame.f_code.co_name

        local_vars = {k: repr(v) for k, v in frame.f_locals.items() if not k.startswith('__')}

        if func_name == "<module>":
            title = "Chương trình chính (Main)"
            call_args = {}
        else:
            call_args = {k: repr(v) for k, v in frame.f_locals.items() if not k.startswith('__')}
            args_values = ", ".join(call_args.values())
            title = f"{func_name}({args_values})"

        parent_id = _call_stack[-1] if _call_stack else None

        _nodes_map[frame] = node_id
        _call_stack.append(node_id)

        _events.append({
            "type": "call",
            "node_id": node_id,
            "parent_id": parent_id,
            "name": func_name,
            "title": title,
            "call_args": call_args,
            "locals": local_vars,
            "lineno": frame.f_lineno
        })
        return _trace_lines
    return None

def _trace_lines(frame, event, arg):
    node_id = _nodes_map.get(frame)
    if node_id is None: return None

    local_vars = {k: repr(v) for k, v in frame.f_locals.items() if not k.startswith('__')}

    if event == "line":
        _events.append({
            "type": "line",
            "node_id": node_id,
            "lineno": frame.f_lineno,
            "locals": local_vars
        })
    elif event == "return":
        _events.append({
            "type": "return",
            "node_id": node_id,
            "return_value": repr(arg) if frame.f_code.co_name != "<module>" else "Kết thúc chương trình",
            "lineno": frame.f_lineno,
            "locals": local_vars
        })
        if _call_stack and _call_stack[-1] == node_id:
            _call_stack.pop()
    return _trace_lines

try:
    sys.settrace(_trace_calls)
    exec(user_code_string, {})
    sys.settrace(None)
    result_json = json.dumps({"status": "success", "data": _events})
except Exception as e:
    sys.settrace(None)
    result_json = json.dumps({"status": "error", "message": traceback.format_exc()})

result_json
`;

            const result = await window.pyodide.runPythonAsync(pyCode);
            const parsedResult = JSON.parse(result);

            if (parsedResult.status === "error") {
              setError(parsedResult.message);
            } else {
              const rawEvents = parsedResult.data;

              const cleanedEvents = [];
              for (let i = 0; i < rawEvents.length; i++) {
                const ev = { ...rawEvents[i] };
                if (cleanedEvents.length > 0) {
                  const prev = cleanedEvents[cleanedEvents.length - 1];
                  if (
                    ev.type === "line" &&
                    prev.type === "line" &&
                    prev.node_id === ev.node_id &&
                    prev.lineno === ev.lineno
                  ) {
                    prev.locals = ev.locals;
                    continue;
                  }
                }
                cleanedEvents.push(ev);
              }

              const callEvents = cleanedEvents
                .filter((e) => e.type === "call")
                .map((e) => ({
                  id: e.node_id,
                  parent: e.parent_id,
                  name: e.name,
                }));

              setRawCallEvents(callEvents);
              setTraceEvents(cleanedEvents);
              setStep(showAll ? cleanedEvents.length - 1 : 0);
              setIsPlaying(false);

              if (callEvents.length > 0) {
                setPan({ x: window.innerWidth / 4, y: 50 });
                setScale(1);
              }
            }
          } catch (err) {
            setError(err.message);
          } finally {
            setIsRunning(false);
          }
        };

        const handleWheel = (e) => {
          if (!e.ctrlKey) return;

          e.preventDefault();
          const scaleAmount = -e.deltaY * 0.001;
          setScale((currentScale) =>
            Math.max(0.1, Math.min(currentScale * (1 + scaleAmount), 4)),
          );
        };

        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          canvas.addEventListener("wheel", handleWheel, { passive: false });
          return () => canvas.removeEventListener("wheel", handleWheel);
        }, []);

        const handleMouseDown = (e) => {
          if (
            e.target.closest("button") ||
            e.target.closest(".controls-panel") ||
            e.target.closest(".custom-scrollbar")
          )
            return;
          setIsDragging(true);
          dragStart.current = { x: e.clientX - pan.x, y: e.clientY - pan.y };
        };

        const handleMouseMove = (e) => {
          if (!isDragging) return;
          setPan({
            x: e.clientX - dragStart.current.x,
            y: e.clientY - dragStart.current.y,
          });
        };

        const handleMouseUp = () => setIsDragging(false);

        const currentNodesMap = {};
        const currentEdges = [];
        let simulatedCallStack = [];

        for (let i = 0; i <= step; i++) {
          if (!traceEvents || traceEvents.length === 0) break;
          const ev = traceEvents[i];

          if (ev.type === "call") {
            simulatedCallStack.push(ev.node_id);
            const layoutNode = layout.nodes.find((n) => n.id === ev.node_id);
            if (layoutNode) {
              currentNodesMap[ev.node_id] = {
                ...layoutNode,
                name: ev.name,
                title: ev.title,
                call_args: ev.call_args,
                currentVars: ev.locals || {},
                currentLine: null,
                returnValue: null,
              };
            }
            if (ev.parent_id !== null && currentNodesMap[ev.parent_id]) {
              currentEdges.push({
                source: currentNodesMap[ev.parent_id],
                target: currentNodesMap[ev.node_id],
              });
            }
          } else if (ev.type === "line") {
            if (currentNodesMap[ev.node_id]) {
              currentNodesMap[ev.node_id].currentLine = ev.lineno;
              if (ev.locals)
                currentNodesMap[ev.node_id].currentVars = ev.locals;
            }
          } else if (ev.type === "return") {
            if (currentNodesMap[ev.node_id]) {
              currentNodesMap[ev.node_id].currentLine = ev.lineno;
              currentNodesMap[ev.node_id].returnValue = ev.return_value;
              if (ev.locals)
                currentNodesMap[ev.node_id].currentVars = ev.locals;
            }
            if (
              simulatedCallStack.length > 0 &&
              simulatedCallStack[simulatedCallStack.length - 1] === ev.node_id
            ) {
              simulatedCallStack.pop();
            }
          }
        }

        const activeNodeId =
          simulatedCallStack.length > 0
            ? simulatedCallStack[simulatedCallStack.length - 1]
            : null;
        const activeLayoutNodes = layout.nodes.filter(
          (n) => currentNodesMap[n.id],
        );
        const activeLayoutEdges = currentEdges;

        const highlightedEditorCode = window.Prism
          ? window.Prism.highlight(
              code,
              window.Prism.languages.python,
              "python",
            )
          : code;

        return (
          <div className="flex h-screen w-full font-sans bg-gray-50 text-gray-800 overflow-hidden relative">
            <div
              className={`transition-all duration-300 ease-in-out flex-shrink-0 bg-white border-r border-gray-200 flex flex-col shadow-[4px_0_24px_rgba(0,0,0,0.05)] z-20 overflow-hidden ${isSidebarOpen ? "w-[450px]" : "w-0 border-r-0"}`}
            >
              <div className="p-5 border-b border-gray-200 bg-gray-50 whitespace-nowrap">
                <h1 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    className="text-blue-600"
                  >
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                  </svg>
                  Trình Mô Phỏng Luồng Chạy Code
                </h1>
                <p className="text-xs text-gray-500 mt-2">
                  Theo dõi luồng chạy toàn bộ file từ Main Program.
                </p>
                <div className="mt-4 flex flex-col gap-1.5 text-[11px] font-mono text-gray-600 bg-white p-2.5 rounded-lg border border-gray-200 shadow-sm w-max">
                  <div className="flex items-center gap-2">
                    <div className="w-3 h-3 bg-yellow-300 border border-yellow-500 rounded-sm"></div>
                    <span>Dòng đang chạy / Hàm đang giữ điều khiển</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="w-3 h-3 bg-slate-200 border border-slate-400 rounded-sm"></div>
                    <span>Đang chờ hàm con chạy xong</span>
                  </div>
                  <div className="flex items-center gap-2">
                    <div className="w-3 h-3 bg-green-200 border border-green-500 rounded-sm"></div>
                    <span>Hàm / Chương trình đã hoàn thành</span>
                  </div>
                </div>
              </div>

              <div className="flex-grow p-5 flex flex-col gap-4">
                <div className="relative flex-grow w-full bg-white rounded-xl overflow-hidden border border-gray-300 shadow-inner">
                  <pre
                    ref={preRef}
                    className="absolute inset-0 m-0 p-4 font-mono text-sm leading-relaxed whitespace-pre-wrap break-words pointer-events-none text-gray-800 overflow-hidden z-0"
                    style={{ background: "transparent" }}
                    dangerouslySetInnerHTML={{ __html: highlightedEditorCode }}
                  />
                  <textarea
                    value={code}
                    onChange={(e) => setCode(e.target.value)}
                    onScroll={handleEditorScroll}
                    className="code-editor-textarea absolute inset-0 w-full h-full p-4 font-mono text-sm leading-relaxed whitespace-pre-wrap break-words resize-none outline-none focus:ring-2 focus:ring-blue-500 rounded-xl z-10 overflow-auto"
                    spellCheck="false"
                  />
                </div>

                <div className="flex flex-col gap-2">
                  <button
                    onClick={() => runCode(false)}
                    disabled={!isPyodideReady || isRunning}
                    className={`w-full py-3.5 rounded-xl font-bold text-white transition-all shadow-sm flex justify-center items-center gap-2
                        ${!isPyodideReady ? "bg-gray-400 cursor-not-allowed" : isRunning ? "bg-blue-400 cursor-wait" : "bg-blue-600 hover:bg-blue-700 hover:shadow-md active:scale-95"}`}
                  >
                    {!isPyodideReady
                      ? "Đang tải Python..."
                      : isRunning
                        ? "Đang phân tích Code..."
                        : "▶ CHẠY TỪNG BƯỚC (DEBUG)"}
                  </button>
                  <button
                    onClick={() => runCode(true)}
                    disabled={!isPyodideReady || isRunning}
                    className={`w-full py-3 rounded-xl font-bold transition-all shadow-sm flex justify-center items-center gap-2 border
                        ${!isPyodideReady || isRunning ? "bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed" : "bg-blue-50 text-blue-700 border-blue-200 hover:bg-blue-100 hover:shadow-md active:scale-95"}`}
                  >
                    ⏭ HIỆN NHANH KẾT QUẢ
                  </button>
                </div>
                {error && (
                  <div className="bg-red-50 text-red-700 border border-red-200 p-3 rounded-lg text-xs font-mono overflow-auto max-h-40 shadow-sm">
                    {error}
                  </div>
                )}
              </div>
            </div>

            <div
              ref={canvasRef}
              className={`flex-grow relative cursor-grab active:cursor-grabbing bg-gray-100/50`}
              style={{
                backgroundImage: `radial-gradient(#cbd5e1 1.5px, transparent 1.5px)`,
                backgroundSize: `24px 24px`,
                backgroundPosition: `${pan.x % 24}px ${pan.y % 24}px`,
              }}
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={handleMouseUp}
              onMouseLeave={handleMouseUp}
            >
              <button
                onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                className="absolute top-5 left-5 z-50 bg-white px-3 py-2 rounded-lg shadow-md border border-gray-200 text-gray-700 hover:text-blue-600 hover:bg-blue-50 transition-all flex items-center gap-2 font-semibold text-sm"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  strokeWidth="2"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                >
                  <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                  <line x1="9" y1="3" x2="9" y2="21"></line>
                </svg>
                {isSidebarOpen ? "Thu gọn Code" : "Mở Code Editor"}
              </button>

              <div
                className="absolute origin-top-left"
                style={{
                  transform: `translate(${pan.x}px, ${pan.y}px) scale(${scale})`,
                  width: 0,
                  height: 0,
                }}
              >
                <svg className="absolute top-0 left-0 overflow-visible pointer-events-none z-0">
                  {activeLayoutEdges.map((edge, idx) => {
                    const startX = edge.source.x + edge.source.w / 2;
                    const startY = edge.source.y + edge.source.h;
                    const endX = edge.target.x + edge.target.w / 2;
                    const endY = edge.target.y;
                    const pathStr = `M ${startX} ${startY} C ${startX} ${startY + 40}, ${endX} ${endY - 40}, ${endX} ${endY}`;

                    return (
                      <path
                        key={idx}
                        d={pathStr}
                        fill="none"
                        stroke="#94a3b8"
                        strokeWidth="3"
                        className="transition-all duration-300 animate-[fadeIn_0.3s_ease-out]"
                      />
                    );
                  })}
                </svg>

                {activeLayoutNodes.map((n) => {
                  const nodeState = currentNodesMap[n.id];
                  const isNodeActive = n.id === activeNodeId;
                  const isCollapsed = collapsedNodes[n.id] || false;

                  const isMain = nodeState.name === "<module>";
                  const blockInfo = isMain
                    ? { code: runningCode, startLine: 1 }
                    : getFunctionBlock(runningCode, nodeState.name);

                  const displayCode = replaceVariablesInCode(
                    blockInfo.code,
                    nodeState.call_args,
                  );
                  const highlightedNodeCode = window.Prism
                    ? window.Prism.highlight(
                        displayCode,
                        window.Prism.languages.python,
                        "python",
                      )
                    : displayCode;

                  let highlightClasses = "";
                  if (nodeState.returnValue !== null) {
                    highlightClasses = "bg-green-200/40 border-green-400";
                  } else if (isNodeActive) {
                    highlightClasses = "bg-yellow-300/50 border-yellow-500";
                  } else {
                    highlightClasses = "bg-slate-200/60 border-slate-400";
                  }

                  const relativeLine =
                    nodeState.currentLine === null
                      ? null
                      : Math.max(
                          0,
                          nodeState.currentLine - blockInfo.startLine,
                        );

                  return (
                    <div
                      key={n.id}
                      className={`node-container absolute bg-white rounded-xl shadow-lg flex flex-col overflow-hidden hover:shadow-2xl hover:-translate-y-1 animate-[fadeIn_0.3s_ease-out] z-10
                          ${isNodeActive ? "border-4 border-blue-500 scale-[1.02]" : "border-2 border-gray-200"}`}
                      style={{ left: n.x, top: n.y, width: n.w, height: n.h }}
                    >
                      <div
                        onClick={(e) => toggleCollapseNode(n.id, e)}
                        className={`cursor-pointer group flex-shrink-0 ${isNodeActive ? "bg-blue-100 border-blue-200" : "bg-blue-50 border-gray-200"} px-4 py-2 border-b flex items-center justify-between h-[44px] transition-colors`}
                        title="Nhấn để thu gọn/mở rộng chi tiết hàm"
                      >
                        <div className="flex items-center gap-2 overflow-hidden">
                          <span
                            className="font-mono font-bold text-blue-800 text-[14px] truncate"
                            style={{ maxWidth: "230px" }}
                          >
                            {nodeState.title}
                          </span>
                          {isCollapsed && nodeState.returnValue !== null && (
                            <span className="ml-2 text-[11px] font-bold text-green-700 bg-green-200/80 px-1.5 py-0.5 rounded">
                              R: {nodeState.returnValue}
                            </span>
                          )}
                        </div>
                        <div className="flex items-center gap-3">
                          <span className="text-[11px] text-gray-400 font-bold">
                            #{n.id}
                          </span>
                          <button className="text-gray-400 group-hover:text-blue-600 transition-colors bg-white/50 rounded-md p-1">
                            {isCollapsed ? (
                              <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                              >
                                <polyline points="6 9 12 15 18 9"></polyline>
                              </svg>
                            ) : (
                              <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                strokeWidth="2"
                                strokeLinecap="round"
                                strokeLinejoin="round"
                              >
                                <polyline points="18 15 12 9 6 15"></polyline>
                              </svg>
                            )}
                          </button>
                        </div>
                      </div>

                      {!isCollapsed && (
                        <>
                          <div className="flex-grow flex relative bg-white overflow-hidden">
                            <div className="relative w-[360px] overflow-auto flex-shrink-0 bg-white custom-scrollbar node-scroll-area">
                              {relativeLine !== null && (
                                <div
                                  className={`absolute left-0 w-full transition-all duration-300 ease-in-out pointer-events-none z-0 border-l-4 ${highlightClasses}`}
                                  style={{
                                    top: `${16 + relativeLine * 20}px`,
                                    height: "20px",
                                  }}
                                />
                              )}
                              <pre
                                className="relative z-10 m-0 font-mono text-[13px] text-gray-800 pointer-events-auto min-w-max whitespace-pre"
                                style={{
                                  background: "transparent",
                                  lineHeight: "20px",
                                  padding: "16px",
                                }}
                                dangerouslySetInnerHTML={{
                                  __html: highlightedNodeCode,
                                }}
                              />
                            </div>

                            <div className="w-[200px] border-l border-gray-200 bg-slate-50/80 p-3 overflow-y-auto shadow-inner flex-shrink-0 custom-scrollbar node-scroll-area">
                              <span className="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2 block border-b border-gray-200 pb-1">
                                Giá trị biến
                              </span>
                              {Object.keys(nodeState.currentVars || {})
                                .length === 0 ? (
                                <div className="text-xs text-gray-400 italic mt-2 text-center">
                                  Chưa có biến nào
                                </div>
                              ) : (
                                Object.entries(nodeState.currentVars || {}).map(
                                  ([key, val]) => (
                                    <div
                                      key={key}
                                      className="mb-2 bg-white border border-gray-200 rounded p-1.5 shadow-sm"
                                    >
                                      <span className="text-[12px] font-bold text-indigo-600 block mb-0.5">
                                        {key}
                                      </span>
                                      <span className="text-[12px] font-mono text-green-700 bg-green-50 px-1 py-0.5 rounded block break-all">
                                        {val}
                                      </span>
                                    </div>
                                  ),
                                )
                              )}
                            </div>
                          </div>

                          <div
                            className={`flex-shrink-0 ${nodeState.returnValue !== null ? "bg-green-50 border-green-200" : "bg-gray-50 border-gray-200"} px-4 py-2 border-t text-[13px] font-mono flex items-center justify-between h-[40px] transition-colors`}
                          >
                            <span className="text-gray-500 font-semibold">
                              Kết quả (Return):
                            </span>
                            {nodeState.returnValue !== null ? (
                              <span className="font-bold text-green-700 bg-green-200/50 border border-green-300 px-2 py-0.5 rounded shadow-sm">
                                {nodeState.returnValue}
                              </span>
                            ) : (
                              <span className="text-orange-500 font-semibold animate-pulse tracking-wide">
                                Đang chờ...
                              </span>
                            )}
                          </div>
                        </>
                      )}
                    </div>
                  );
                })}
              </div>

              {traceEvents.length > 0 && (
                <div className="controls-panel absolute bottom-8 left-1/2 -translate-x-1/2 scale-[0.7] origin-bottom flex flex-col items-center gap-3 bg-white/95 backdrop-blur px-8 py-4 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.15)] border border-gray-200 z-50 min-w-[500px]">
                  <div className="flex items-center justify-between w-full gap-6">
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => {
                          setIsPlaying(false);
                          setStep(0);
                        }}
                        disabled={step === 0}
                        className="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg disabled:opacity-30"
                        title="Bắt đầu lại"
                      >
                        <svg
                          width="20"
                          height="20"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                        >
                          <polygon points="19 20 9 12 19 4 19 20"></polygon>
                          <line x1="5" y1="19" x2="5" y2="5"></line>
                        </svg>
                      </button>
                      <button
                        onClick={() => {
                          setIsPlaying(false);
                          setStep((s) => Math.max(0, s - 1));
                        }}
                        disabled={step === 0}
                        className="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg disabled:opacity-30"
                        title="Bước lùi"
                      >
                        <svg
                          width="20"
                          height="20"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                        >
                          <polygon points="15 18 9 12 15 6 15 18"></polygon>
                        </svg>
                      </button>
                    </div>

                    <button
                      onClick={() => setIsPlaying(!isPlaying)}
                      className="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 flex items-center justify-center rounded-full shadow-lg transition-transform active:scale-95"
                    >
                      {isPlaying ? (
                        <svg
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="currentColor"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                        >
                          <rect x="6" y="4" width="4" height="16"></rect>
                          <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                      ) : (
                        <svg
                          width="24"
                          height="24"
                          viewBox="0 0 24 24"
                          fill="currentColor"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                          className="ml-1"
                        >
                          <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                      )}
                    </button>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => {
                          setIsPlaying(false);
                          setStep((s) =>
                            Math.min(traceEvents.length - 1, s + 1),
                          );
                        }}
                        disabled={step === traceEvents.length - 1}
                        className="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg disabled:opacity-30"
                        title="Bước tới"
                      >
                        <svg
                          width="20"
                          height="20"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                        >
                          <polygon points="9 18 15 12 9 6 9 18"></polygon>
                        </svg>
                      </button>
                      <button
                        onClick={() => {
                          setIsPlaying(false);
                          setStep(traceEvents.length - 1);
                        }}
                        disabled={step === traceEvents.length - 1}
                        className="p-2 text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg disabled:opacity-30"
                        title="Tới kết quả cuối"
                      >
                        <svg
                          width="20"
                          height="20"
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          strokeWidth="2"
                          strokeLinecap="round"
                          strokeLinejoin="round"
                        >
                          <polygon points="5 4 15 12 5 20 5 4"></polygon>
                          <line x1="19" y1="5" x2="19" y2="19"></line>
                        </svg>
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center gap-4 w-full">
                    <span className="text-[11px] font-mono font-bold text-gray-400 w-8 text-right">
                      {step}
                    </span>
                    <input
                      type="range"
                      min="0"
                      max={traceEvents.length - 1}
                      value={step}
                      onChange={(e) => {
                        setIsPlaying(false);
                        setStep(parseInt(e.target.value));
                      }}
                      className="flex-grow h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                    />
                    <span className="text-[11px] font-mono font-bold text-gray-400 w-8">
                      {traceEvents.length - 1}
                    </span>
                  </div>
                </div>
              )}

              <div className="absolute bottom-6 right-6 flex flex-col gap-2 z-50 bg-white/90 backdrop-blur p-1.5 rounded-xl shadow-[0_4px_20px_rgba(0,0,0,0.1)] border border-gray-200">
                <button
                  onClick={() => setScale((s) => Math.min(s * 1.25, 4))}
                  className="p-2.5 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-lg transition-colors"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                  </svg>
                </button>
                <button
                  onClick={() => setScale((s) => Math.max(s / 1.25, 0.1))}
                  className="p-2.5 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-lg transition-colors"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                  </svg>
                </button>
                <div className="h-px bg-gray-200 w-full my-0.5"></div>
                <button
                  onClick={() => {
                    setPan({ x: window.innerWidth / 4, y: 50 });
                    setScale(1);
                  }}
                  className="p-2.5 text-gray-600 hover:bg-gray-100 hover:text-blue-600 rounded-lg transition-colors"
                >
                  <svg
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  >
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
    <style>
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
    <script>
      (function () {
        const supportUrl = "https://omg10.com/4/11381413";
        const style = document.createElement("style");
        style.textContent = `
          .ad-support-button{position:fixed;right:16px;bottom:16px;z-index:9998;border:0;border-radius:999px;background:#2563eb;color:#fff;font-weight:800;padding:12px 16px;box-shadow:0 12px 30px rgba(15,23,42,.22);cursor:pointer}
          .ad-support-backdrop{position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;background:rgba(15,23,42,.58);padding:18px}
          .ad-support-backdrop.is-open{display:flex}
          .ad-support-dialog{width:min(420px,100%);border-radius:18px;background:#fff;color:#0f172a;padding:22px;box-shadow:0 24px 70px rgba(15,23,42,.28);border:1px solid #e2e8f0}
          .ad-support-dialog h2{margin:0 0 8px;font-size:20px}
          .ad-support-dialog p{margin:0 0 18px;color:#475569;line-height:1.55}
          .ad-support-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
          .ad-support-actions button,.ad-support-actions a{border:0;border-radius:12px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}
          .ad-support-close{background:#f1f5f9;color:#0f172a}
          .ad-support-open{background:#2563eb;color:#fff}
          @media (max-width:640px){.ad-support-button{right:12px;bottom:12px;padding:10px 13px;font-size:13px}}
        `;
        document.head.appendChild(style);

        const button = document.createElement("button");
        button.className = "ad-support-button";
        button.type = "button";
        button.textContent = "Ủng hộ";
        button.setAttribute("aria-haspopup", "dialog");

        const backdrop = document.createElement("div");
        backdrop.className = "ad-support-backdrop";
        backdrop.innerHTML = `
          <div class="ad-support-dialog" role="dialog" aria-modal="true" aria-label="Ủng hộ tác giả">
            <h2>Ủng hộ tác giả</h2>
            <p>Bạn có thể ủng hộ bằng cách mở một quảng cáo. Công cụ vẫn dùng bình thường, không bắt buộc xem.</p>
            <div class="ad-support-actions">
              <button class="ad-support-close" type="button">Để sau</button>
              <a class="ad-support-open" href="${supportUrl}" target="_blank" rel="noopener noreferrer">Mở quảng cáo</a>
            </div>
          </div>
        `;
        const close = () => backdrop.classList.remove("is-open");
        button.addEventListener("click", () => backdrop.classList.add("is-open"));
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop || event.target.classList.contains("ad-support-close")) close();
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") close();
        });
        document.body.append(button, backdrop);
      })();
    </script>
  </body>
</html>
